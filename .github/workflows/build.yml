name: Installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installa NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Crea installer Windows
        run: |
          VERSION=$(sed -n 's/.*ExtensionBundleVersion="\([^"]*\)".*/\1/p' extension/CSXS/manifest.xml)
          mkdir -p dist
          makensis -V2 -DVERSION="$VERSION" installer/windows/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea installer macOS
        run: bash installer/mac/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*.pkg

  # Pubblica la Release a ogni push su main (cioè quando si fa il merge di una PR)
  # oppure quando si crea un tag v*. Il numero di versione viene dal manifest.
  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi la versione
        id: version
        run: echo "version=$(sed -n 's/.*ExtensionBundleVersion="\([^"]*\)".*/\1/p' extension/CSXS/manifest.xml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pubblica la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Illustrator Quote ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **Windows**: scarica `IllustratorQuote-Setup-${{ steps.version.outputs.version }}.exe` e fai doppio clic.
            **Mac**: scarica `IllustratorQuote-${{ steps.version.outputs.version }}.pkg` e fai doppio clic.
            Poi apri Illustrator: Finestra > Estensioni > Quote.

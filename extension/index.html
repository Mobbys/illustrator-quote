<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Quote</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="info" class="info">Seleziona uno o più oggetti</div>

  <section>
    <h2>Cosa quotare</h2>
    <div class="seg" id="mode">
      <button data-value="each" title="Larghezza e altezza di ogni oggetto">Ogni oggetto</button>
      <button data-value="all" title="Ingombro totale della selezione">Selezione</button>
      <button data-value="gaps" title="Distanze libere tra oggetti vicini">Distanze</button>
      <button data-value="points" title="Distanze tra punti scelti con la Selezione diretta (A), anche su oggetti diversi">Punti</button>
      <button data-value="diameter" title="Diametro di cerchi ed ellissi">Diametro</button>
      <button data-value="radius" title="Raggio di cerchi ed ellissi">Raggio</button>
    </div>
    <div id="pointsOpts" class="hint" hidden>
      Seleziona i punti con la <b>Selezione diretta (A)</b>, anche su oggetti diversi (Maiusc per aggiungerli).
      <label class="check"><input type="checkbox" id="aligned"> Distanza diretta tra 2 punti</label>
    </div>
    <div class="sides" id="sides" title="Lati su cui mettere le quote">
      <label class="side side-top" title="Sopra"><input type="checkbox" id="top"><span></span></label>
      <label class="side side-left" title="Sinistra"><input type="checkbox" id="left"><span></span></label>
      <div class="side-object"></div>
      <label class="side side-right" title="Destra"><input type="checkbox" id="right"><span></span></label>
      <label class="side side-bottom" title="Sotto"><input type="checkbox" id="bottom"><span></span></label>
    </div>
    <label class="check" id="visibleOpt"><input type="checkbox" id="useVisible"> Includi spessore tratto</label>
  </section>

  <button id="btnQuote" class="primary">Quota</button>

  <div class="pair">
    <button id="btnUpdate" title="Ridisegna le quote selezionate con lo stile impostato qui sotto">Aggiorna quote selezionate</button>
    <button id="btnPick" title="Copia nel pannello lo stile della quota selezionata">Prendi stile</button>
  </div>

  <section>
    <h2>Preset di stile</h2>
    <div class="row">
      <select id="presetList" title="Applica un preset salvato"></select>
      <button id="btnPresetDelete" class="small danger" title="Elimina il preset scelto">Elimina</button>
    </div>
    <details id="presetMore">
      <summary>Salva, esporta, importa…</summary>
      <div class="row">
        <input type="text" id="presetName" placeholder="Nome del preset" maxlength="40">
        <button id="btnPresetSave" class="small" title="Salva lo stile attuale con questo nome">Salva</button>
      </div>
      <div class="row">
        <button id="btnPresetExport" class="grow" title="Salva tutti i preset in un file da dare ai colleghi">Esporta…</button>
        <button id="btnPresetImport" class="grow" title="Carica i preset da un file">Importa…</button>
      </div>
      <button id="btnLegacy" title="Carica lo stile dal livello __DimensionSettingsData__ del vecchio sistema e dice cosa trova">Carica impostazioni del vecchio sistema</button>
    </details>
  </section>

  <section>
    <h2>Misure</h2>
    <div class="row">
      <label>Unità
        <select id="unit">
          <option value="mm">mm</option>
          <option value="cm">cm</option>
          <option value="in">in</option>
          <option value="pt">pt</option>
          <option value="px">px</option>
        </select>
      </label>
      <label>Decimali <input type="number" id="decimals" min="0" max="4" step="1"></label>
      <label>Scala 1: <input type="number" id="scale" min="0.0001" step="any"></label>
    </div>
    <label class="check"><input type="checkbox" id="comma"> Virgola come separatore</label>
    <label class="check"><input type="checkbox" id="showUnit"> Mostra unità nel testo</label>
  </section>

  <section>
    <h2>Stile</h2>
    <div class="quick">
      <div class="swatch" title="Colore di linee e frecce"><span>Linee</span><button class="chip" data-color="color"></button><input type="hidden" id="color"></div>
      <div class="swatch" title="Colore del testo"><span>Testo</span><button class="chip" data-color="textColor"></button><input type="hidden" id="textColor"></div>
      <label class="factor-field" title="Moltiplicatore: scala testo, tratto, frecce e distanze"><span>×</span><input type="number" id="sizeFactor" min="0.05" step="0.1"></label>
    </div>
    <div id="colorPop" class="color-pop" hidden>
      <div class="tabs" id="colorModel">
        <button data-value="cmyk">CMYK</button>
        <button data-value="rgb">RGB</button>
      </div>
      <div id="cmykFields" class="cmyk">
        <label>C <input type="number" id="cmykC" min="0" max="100" step="1"></label>
        <label>M <input type="number" id="cmykM" min="0" max="100" step="1"></label>
        <label>Y <input type="number" id="cmykY" min="0" max="100" step="1"></label>
        <label>K <input type="number" id="cmykK" min="0" max="100" step="1"></label>
      </div>
      <div id="rgbFields" class="rgb" hidden>
        <input type="color" id="rgbPick">
        <input type="text" id="rgbHex" maxlength="7" placeholder="#000000">
      </div>
      <div class="row">
        <button id="btnAiPicker" class="small grow" title="Apre il selettore colore di Illustrator">Selettore di Illustrator…</button>
        <button id="btnColorDone" class="small">Fatto</button>
      </div>
    </div>
    <div class="factors">
      <button class="small" data-factor="0.5">×0,5</button>
      <button class="small" data-factor="1">×1</button>
      <button class="small" data-factor="2">×2</button>
      <button class="small" data-factor="5">×5</button>
      <button class="small" data-factor="10">×10</button>
      <button class="small" data-factor="20">×20</button>
      <button class="small" data-factor="30">×30</button>
    </div>
    <details id="styleMore">
      <summary>Altre opzioni di stile</summary>
      <div class="row">
        <label>Distanza (mm) <input type="number" id="offsetMm" min="0" step="0.5"></label>
        <label>Stacco (mm) <input type="number" id="gapMm" min="0" step="0.5"></label>
      </div>
      <div class="row">
        <label>Testo (pt) <input type="number" id="fontSize" min="1" step="0.5"></label>
        <label title="Distanza tra testo e linea di quota">Spazio (mm) <input type="number" id="textGapMm" min="0" step="0.5"></label>
        <label>Tratto (pt) <input type="number" id="strokeWidth" min="0.1" step="0.1"></label>
      </div>
      <div class="row">
        <label>Terminali
          <select id="endStyle">
            <option value="arrow">Frecce</option>
            <option value="tick">Barrette</option>
            <option value="dot">Punti</option>
            <option value="none">Nessuno</option>
          </select>
        </label>
        <label>Dim. (pt) <input type="number" id="endSize" min="1" step="0.5"></label>
      </div>
    </details>
  </section>

  <div class="actions">
    <label class="check" title="Impostazione di questo computer, non salvata nel file"><input type="checkbox" id="lockLayer"> Blocca il livello Quote dopo la quotatura</label>
    <button id="btnToggle">Mostra/Nascondi quote</button>
    <button id="btnClear" class="danger">Elimina tutte le quote</button>
  </div>

  <div id="status" class="status"></div>
  <div id="version" class="version"></div>

  <script src="js/main.js"></script>
</body>
</html>
